# Lebendes Haus: 7"-Panel (Guition JC1060P470C, 1024 × 600)
#
# Oben die Einstellungen, darunter alle Geräte nach Raum. Raum-IDs und
# Fensterzuordnung (Index der Rollläden und Kontakte) stehen in core/house.h.

substitutions:
  device_name: panel-haus
  friendly_name: Panel Haus
  house_name: Zuhause
  # FPS-Anzeige unten links und im Log ("false" schaltet sie ab)
  show_fps: "true"
  weather_entity: weather.forecast_home
  lock_entity: lock.turschlossantrieb_haustur_eg
  # Energie (W)
  pv_power: sensor.deye_wechselrichter_deye_dc_gesamtleistung
  hoymiles_power: sensor.hmt_2250_6t_power
  house_power: sensor.hausverbrauch
  battery_power: sensor.deye_wechselrichter_deye_batterie_leistung   # + Entladen / - Laden
  battery_soc: sensor.deye_wechselrichter_deye_batterie_soc
  grid_power: sensor.deye_wechselrichter_deye_netz_gesamtleistung    # + Bezug / - Einspeisung
  heater_power: sensor.ac_elwa_2_power_elwa_2
  # go-e-Wallbox (noch nicht in HA: bleibt leer, bis die Entitäten existieren)
  wallbox_power: sensor.go_echarger_power
  wallbox_energy_today: sensor.go_echarger_energy_today

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

packages:
  device: !include base/device.yml
  core: !include core/index.yml



# Netzwerk und Verbindung zu Home Assistant

logger:
  # DEBUG würde jedes einzelne HA-Update loggen
  level: INFO

# WLAN über den ESP32-C6 (esp32_hosted in hardware.yml).
# Für Ethernet stattdessen den ethernet-Block in hardware.yml einkommentieren
# und diesen wifi-Block entfernen.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Fallback-Hotspot, falls das WLAN nicht erreichbar ist
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret fallback_password

captive_portal:

api:
  encryption:
    key: !secret api_key
  # Ohne Home Assistant nicht neu starten, sondern weiter anzeigen
  # (Standard wäre ein Neustart nach 15 min)
  reboot_timeout: 0s
  on_client_connected:
    - if:
        condition:
          lambda: 'return (0 == client_info.find("Home Assistant "));'
        then:
          - script.execute: on_ha_connected
  on_client_disconnected:
    - if:
        condition:
          lambda: 'return (0 == client_info.find("Home Assistant "));'
        then:
          - script.execute: on_ha_disconnected

ota:
  - platform: esphome
    on_begin:
      - light.turn_off:
          id: display_backlight
          transition_length: 0s
      - lambda: "id(display_backlight).loop();"
    # Abgebrochenes Update: Display wieder einschalten
    on_error:
      - light.turn_on:
          id: display_backlight
          transition_length: 0s

name: Screenshots

# Baut die SDL-Vorschau, tippt die Seiten durch und legt die Bilder in docs/ ab.
# Haben sie sich geändert, werden sie committet (docs/ löst keinen neuen Lauf aus).
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:

concurrency:
  group: screenshots
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsdl2-dev xvfb imagemagick xdotool ffmpeg
          pip install -r requirements.txt

      - name: Cache ESPHome toolchain
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-host-${{ runner.os }}-${{ hashFiles('**/*.yml') }}
          restore-keys: pio-host-${{ runner.os }}-

      - name: Render
        run: |
          GIF=1 sh preview/render.sh house.yml

      - name: Copy to docs
        run: |
          mkdir -p docs
          cp preview/shots/house/haus.png preview/shots/house/raum.png preview/shots/house/schlafzimmer.png \
            preview/shots/house/klima.png preview/shots/house/heizung.png preview/shots/house/demo.gif docs/

      - name: Commit if changed
        run: |
          git add docs
          if git diff --cached --quiet; then
            echo "Screenshots unverändert"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: Screenshots aktualisieren"
          git push
